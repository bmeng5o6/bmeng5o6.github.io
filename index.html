<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Brian Meng</title>
<meta name="description" content="Brian Meng — CS + Math-Econ at Penn. Projects, experience, arts, and contact.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="css/styles.css">
<style>html { background: #000; color-scheme: dark; }</style>
<script>
  // Play the "hello" intro on every normal load (any click/key/scroll skips it).
  // Skipped on deep links like #projects so shared links land straight on the section.
  if (!location.hash) document.documentElement.classList.add('is-intro');
</script>
</head>
<body>

<div class="hello" id="hello" aria-hidden="true"><span class="hello-word" id="helloWord"></span></div>

<canvas id="stars" aria-hidden="true"></canvas>
<div class="backdrop" id="backdrop"></div>

<!-- Planet, orbit, and asteroids. Asteroids are injected by main.js. -->
<div class="system" id="system">
    <svg class="orbit orbit-back" aria-hidden="true"><g id="orbitBackG"><path id="orbitBack"/></g></svg>
    <div class="planet" id="planet" aria-hidden="true"></div>  <!-- fallback if WebGL is unavailable -->
    <canvas class="planet-gl" id="planetGL" aria-hidden="true"></canvas>
    <svg class="orbit orbit-front" aria-hidden="true"><g id="orbitFrontG"><path id="orbitFront"/></g></svg>

    <button type="button" class="focus-label" id="focusLabel">
        <span class="fl-name" id="flName"></span>
    </button>
</div>

<header class="intro" id="intro">
    <h1>Brian Meng</h1>
    <p class="role">CS + Math-Econ <span>@ Penn</span></p>
    <p class="pitch">I like backend and full-stack development, ML, and low-level design.</p>
    <div class="links" id="links"></div>
    <nav class="quicknav" aria-label="Sections">
        <ol id="quicknavList"></ol>
    </nav>
</header>


<aside class="panel" id="panel" role="dialog" aria-labelledby="panelTitle" aria-hidden="true" inert>
    <button class="panel-close" id="panelClose" type="button" aria-label="Close panel">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="panel-scroll" id="panelScroll">
        <div class="panel-content" id="panelContent">
            <p class="p-eyebrow" id="panelEyebrow"></p>
            <h2 id="panelTitle" tabindex="-1"></h2>
            <div id="panelBody"></div>
        </div>
    </div>
    <footer class="panel-nav">
        <button type="button" id="panelPrev"></button>
        <button type="button" id="panelNext"></button>
    </footer>
</aside>

<script src="js/content.js"></script>
<script src="js/planet.js"></script>
<script src="js/main.js"></script>
</body>
</html>
